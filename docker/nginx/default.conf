server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/ticketly_access.log;
    error_log /var/log/nginx/ticketly_error.log;

    # Charset
    charset utf-8;

    # Main routing for CodeIgniter 4
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching & serving
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # FastCGI processing for PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Forward authorization header for JWT
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Proxy headers
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;

        # Timeouts for longer processes (e.g. PDF generation, seeders)
        fastcgi_read_timeout 180;
        fastcgi_connect_timeout 180;
        fastcgi_send_timeout 180;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to system/writable directories
    location ~ /(app|system|writable|tests)/ {
        deny all;
        return 404;
    }
}
